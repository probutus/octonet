# =====================================================================
# GLOBAL / NETWORK SETTINGS
# =====================================================================
server.modules = (
    "mod_auth",
    "mod_accesslog",
    "mod_cgi",
    "mod_authn_file",
    "mod_openssl",
    "mod_rewrite",
    "mod_proxy",
    "mod_setenv"
)

server.document-root = "/var/www"
server.port = 80
server.pid-file = "/var/run/lighttpd.pid"
index-file.names = ( "index.lua", "index.html" )

# Aktivierte Protokollierung im RAM
server.errorlog = "/tmp/lighttpd_error.log"
accesslog.filename = "/tmp/lighttpd_access.log"

# =====================================================================
# INBOUND ENVIRONMENT SETTINGS
# =====================================================================
setenv.add-environment = (
    "PATH" => "/usr/bin:/bin:/usr/sbin:/sbin",
    "HOME" => "/root",
    "ROOT" => "/"
)

#cgi.execute-x-allowed = "enable"
cgi.assign = (
    ".lua" => "/usr/bin/lua"
)

# =====================================================================
# HTTPS / SSL CONFIGURATION (Port 443)
# =====================================================================
$SERVER["socket"] == ":443" {
    ssl.engine = "enable"
    ssl.pemfile = "/etc/lighttpd/certs/server.pem"
    ssl.openssl.ssl-conf-cmd = ("MinProtocol" => "TLSv1.2")
}

# =====================================================================
# SELECTIVE URL-REWRITE & PROXY LOGIK (Hängesicher entkoppelt)
# =====================================================================

# 1. AUSNAHMEN: Nur die beiden Lua-Skripte werden lokal umgeschrieben
# (Dadurch flüchten sie aus dem /octoserve/ Pfad):
url.rewrite-once = (
    "^/octoserve/tunerstatus\.json$" => "/tunerstatus.json.lua",
    "^/octoserve/serverinfo\.js$"    => "/serverinfo.js.lua"
)

# 2. PROXY-WEICHE: Alle VERBLEIBENDEN xml/json-Anfragen unter /octoserve/
# werden direkt hier abgefangen:
$HTTP["url"] =~ "^/octoserve/.*\.(json|xml)$" {
    proxy.server = (
        "" => ( ( "host" => "127.0.0.1", "port" => 8888 ) )
    )
    # Entfernt das "/octoserve" dynamisch auf dem Weg zum Port 8888,
    # ohne das globale URL-Rewriting zu stören!
    proxy.header = (
        "map-urlpath" => ( "/octoserve/" => "/" )
    )
}

# =====================================================================
# AUTHENTIFIZIERUNGSSCHUTZ (HTTP Digest mit PCRE-Ausnahme)
# =====================================================================
auth.backend = "htdigest"
auth.backend.htdigest.userfile = "/etc/lighttpd/.htdigest"

# Erlaubt .xml, .json und die intern umgeschriebenen .lua-Skripte passwortfrei:
$HTTP["url"] !~ "\.(xml|json)$|/tunerstatus\.json\.lua|/serverinfo\.js\.lua" {
    auth.require = ( 
        "/" => (
            "method"  => "digest",
            "realm"   => "Octonet Protected Area",
            "require" => "valid-user"
        )
    )
}

