# =====================================================================
# GLOBAL / NETWORK SETTINGS
# =====================================================================
server.modules = (
    "mod_accesslog",
    "mod_cgi",
    "mod_auth",
    "mod_authn_file",
    "mod_openssl",
    "mod_rewrite",     # <--- Wieder aktivieren für das selektive Stripping
    "mod_proxy",
    "mod_setenv"
)

server.document-root = "/var/www"
server.port = 80
server.pid-file = "/var/run/lighttpd.pid"
index-file.names = ( "index.lua", "index.html" )

# Aktivierte Protokollierung im RAM
server.errorlog = "/tmp/lighttpd_error.log"
accesslog.filename = "/tmp/lighttpd_access.log"

# =====================================================================
# INBOUND ENVIRONMENT SETTINGS
# =====================================================================
setenv.add-environment = (
    "PATH" => "/usr/bin:/bin:/usr/sbin:/sbin",
    "HOME" => "/root",
    "ROOT" => "/"
)

cgi.execute-x-allowed = "enable"
cgi.assign = (
    ".lua" => "/usr/bin/lua"
)

# =====================================================================
# HTTPS / SSL CONFIGURATION (Port 443)
# =====================================================================
$SERVER["socket"] == ":443" {
    ssl.engine = "enable"
    ssl.pemfile = "/etc/lighttpd/certs/server.pem"
    ssl.openssl.ssl-conf-cmd = ("MinProtocol" => "TLSv1.2")
}

# =====================================================================
# SELECTIVE PCRE URL-STRIPPING (NUR für XML und JSON)
# =====================================================================
# Diese Regel schneidet das "/octoserve" NUR weg, wenn die Datei auf
# .xml oder .json endet. Ihr menu.js und alle anderen Skripte sind absolut sicher!
url.rewrite-once = (
    "^/octoserve/(.*(json|xml))$" => "/$1"
)

# =====================================================================
# ORIGINAL PROXY LOGIK (Nur für XML und JSON)
# =====================================================================
proxy.server = (
    ".json" => ( ( "host" => "127.0.0.1", "port" => 8888 ) ),
    ".xml"  => ( ( "host" => "127.0.0.1", "port" => 8888 ) )
)

# =====================================================================
# AUTHENTIFIZIERUNGSSCHUTZ (HTTP Digest mit PCRE-Ausnahme)
# =====================================================================
auth.backend = "htdigest"
auth.backend.htdigest.userfile = "/etc/lighttpd/.htdigest"

# WASSERDICHTER GUARD: 
# Wir fordern das Passwort nur an, wenn die angeforderte URL 
# NICHT (!) auf .xml oder .json endet. 
# Dadurch bleiben alle DLNA-Geräte und die Proxy-Daten absolut passwortfrei!
$HTTP["url"] !~ "\.(xml|json)$" {
    auth.require = ( 
        "/" => (
            "method"  => "digest",
            "realm"   => "Octonet Protected Area",
            "require" => "valid-user"
        )
    )
}

