<!DOCTYPE HTML>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OctopusNet - Erstkonfiguration</title>
  <link rel="stylesheet" type="text/css" href="/style.css">
</head>
<body class="setup-body">

  <div class="setup-container">
    <div class="card text-center setup-card">
      
      <div class="update-warning-icon">⚙️</div>
      
      <h2 class="margin-bottom">Erstkonfiguration</h2>
      
      <p class="update-subtext">
        Bitte lege das Administrator-Passwort für den Benutzer 
        <strong>admin</strong> fest:
      </p>
      
      <form action="setup_save.lua" method="POST" class="form-grid margin-top-heavy">
        <div class="form-group text-left">
          <label>Neues Passwort:</label>
          <input type="password" name="pwd1" class="form-control" 
                 placeholder="Passwort eingeben" required>
        </div>
        
        <div class="form-group text-left">
          <label>Passwort wiederholen:</label>
          <input type="password" name="pwd2" class="form-control" 
                 placeholder="Passwort wiederholen" required>
        </div>

        <div class="center-content margin-top-heavy">
          <button type="submit" class="btn btn-primary btn-block">
            Passwort speichern
          </button>
        </div>
      </form>

    </div>
  </div>

</body>
</html>
