<!DOCTYPE HTML>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OctopusNet - EPG</title>
  <link rel="stylesheet" type="text/css" href="/style.css">
  <script type="text/javascript" src="/menu.js"></script>
  <script type="text/javascript">
  var reqChannelList = new XMLHttpRequest();
  reqChannelList.onreadystatechange = function() {
    if (reqChannelList.readyState == 4) {
      if (reqChannelList.status == 200) {
        ChannelListResponse(reqChannelList.responseText);
      } else if (reqChannelList.status == 404) {
        document.getElementById("message").firstChild.nodeValue = 
          "Error loading channellist";
      }
    }
  }

  var reqEPG = new XMLHttpRequest();
  reqEPG.onreadystatechange = function() {
    if (reqEPG.readyState == 4) {
      if (reqEPG.status == 200) {
        EPGResponse(reqEPG.responseText);
      } else if (reqEPG.status == 404) {
        document.getElementById("message").firstChild.nodeValue = 
          "EPG not available";
      }
    }
  }

  var EPG = null;
  var ChannelList = null;
  var ChannelLookup = null;

  function LoadEPG() {
    reqEPG.open("GET", "/epg.lua", true);
    reqEPG.send();
  }

  function ChannelListResponse(response) {
    var Valid = false;
    try {
      ChannelList = JSON.parse(response);
      if (ChannelList.GroupList[0].ChannelList) {
        ChannelLookup = new Object();
        for (var i = 0; i < ChannelList.GroupList.length; i += 1) {
          var Group = ChannelList.GroupList[i];
          for (var j = 0; j < Group.ChannelList.length; j += 1) {
            if (Group.ChannelList[j].ID) {
              Valid = true;
              ChannelLookup[Group.ChannelList[j].ID] = Group.ChannelList[j];
            }
          }
        }
      }
    } catch(e) {
      Valid = false;
    }
    if (Valid) { LoadEPG(); } 
    else {
      document.getElementById("message").firstChild.nodeValue = 
        "EPG not available";
    }
  }

  function CompareTime(a, b) {
    return (a.Time > b.Time) ? 1 : -1;
  }

  var Position = 2000;

  function EPGResponse(response) {
    try {
      EPG = JSON.parse(response);
      document.getElementById("message").firstChild.nodeValue = "Sorting...";
      EPG.EventList.sort(CompareTime);
      document.getElementById("message").firstChild.nodeValue = 
        EPG.EventList.length + " Events";
      document.getElementById("message").style.display = "none";
      document.getElementById("events").style.display = "block";
      Current();
    } catch(e) {
      document.getElementById("message").firstChild.nodeValue = e.message;
    }
  }

  var hasTimeInput = false;
  var hasIntl = false;
  var DateOptions = { weekday: "long", day: "numeric", month: "long", year: "numeric" };
  var TimeOptions = { hour: "2-digit", minute: "2-digit", hour12: false };
  var Locale;

  function OnLoad() {
    var input = document.getElementById("datetime");
    hasTimeInput = (input.type == "datetime-local");
    if (!hasTimeInput) {
      input.form.style.display = "none";
    }
    if (window.Intl && typeof window.Intl === "object") {
      hasIntl = true;
      var Region = new Intl.DateTimeFormat();
      var o = Region.resolvedOptions();
      Locale = o.locale;
    }
    document.getElementById("events").style.display = "none";
    EPG = null;
    var msg = document.getElementById("message");
    msg.firstChild.nodeValue = "Loading...";
    msg.style.display = "block";
    reqChannelList.open("GET", "/channellist.lua?select=json", true);
    reqChannelList.send();
  }

  function Current() {
    var d = new Date();
    var input = document.getElementById("datetime");
    if (input.type == "datetime-local") {
      var d1 = new Date(d.getTime() - d.getTimezoneOffset() * 60000);
      input.value = d1.toISOString().substr(0,16);
    }
    Position = Search(d);
    Scroll(0);
  }

  function Scroll(amount) {
    Position += amount;
    if (Position < 0) Position = 0;
    else if (Position + 1 >= EPG.EventList.length) {
      Position = EPG.EventList.length - 5;
    }
    for (var i = 0; i < 5; i += 1) {
      ShowEvent(EPG.EventList[Position+i], i);
    }
  }

  function Search(d) {
    var a = 0;
    var b = EPG.EventList.length - 1;
    var i;
    while ((b - a) > 1) {
      i = Math.floor(a + (b - a)/2);
      var d1 = new Date(EPG.EventList[i].Time);
      if (d1 >= d) b = i; else a = i;
    }
    return b;
  }

  function ShowEvent(event, index) {
    var box = document.getElementById("event" + index);
    var d = new Date(event.Time);
    var id = event.ID.match(/[A-Z0-9]+:\d+:\d+:\d+/);
    var ch = ChannelLookup[id[0]];
    var Channel = "\u00A0";
    var Text = "";
    var Name = "";
    if (ch) Channel = ch.Title;
    if (event.Text) Text = event.Text;
    if (event.Name) Name = event.Name;
    box.getElementsByClassName("event_date")[0].firstChild.nodeValue = 
      d.toLocaleDateString(Locale, DateOptions) + " - " + 
      d.toLocaleTimeString(Locale, TimeOptions);
    box.getElementsByClassName("event_duration")[0].firstChild.nodeValue = 
      event.Duration + " Min.";
    box.getElementsByClassName("event_channel")[0].firstChild.nodeValue = Channel;
    box.getElementsByClassName("event_name")[0].firstChild.nodeValue = Name;
    box.getElementsByClassName("event_text")[0].firstChild.nodeValue = Text;
  }

  function ClearEvent(index) {
    var box = document.getElementById("event" + index);
    box.getElementsByClassName("event_date")[0].firstChild.nodeValue = "";
    box.getElementsByClassName("event_duration")[0].firstChild.nodeValue = "";
    box.getElementsByClassName("event_channel")[0].firstChild.nodeValue = "";
    box.getElementsByClassName("event_name")[0].firstChild.nodeValue = "";
    box.getElementsByClassName("event_text")[0].firstChild.nodeValue = "";
  }

  function ScrollTo() {
    var d = new Date();
    var input = document.getElementById("datetime");
    if (input.value == "") {
      Current();
    } else {
      if (input.type == "datetime-local") {
        d = new Date(Date.parse(input.value) + d.getTimezoneOffset() * 60000);
      }
      Position = Search(d);
      Scroll(0);
    }
  }

  function SearchText() {
    var j = 0;
    var SearchText = document.getElementById("searchtext").value.toLowerCase();
    if (SearchText.length > 0) {
      for (var i = Position; i < EPG.EventList.length && j < 5; i += 1) {
        var event = EPG.EventList[i];
        var id = event.ID.match(/[A-Z0-9]+:\d+:\d+:\d+/);
        var ch = ChannelLookup[id[0]];
        var Compare = "";
        if (ch) Compare = Compare + ch.Title;
        if (event.Text) Compare = Compare + "\u00A0" + event.Text;
        if (event.Name) Compare = Compare + "\u00A0" + event.Name;
        Compare = Compare.toLowerCase();
        if (Compare.indexOf(SearchText) >= 0) {
          ShowEvent(event, j);
          j = j + 1;
          Position = i + 1;
        }
      }
      if (j == 0) Position = 0;
      for (j = j; j < 5; j += 1) { ClearEvent(j); }
    } else {
      Current();
    }
  }
  </script>
</head>
<body onload="OnLoad()">
  <div class="app-container">
    
    <header class="main-header">
      <a href="http://digitaldevices.de" class="logo-link">
        <img src="/krake_octo.png" alt="Digital Devices Logo" class="logo-img" />
      </a>
    </header>

    <div class="content-wrapper">
      <nav class="side-navigation">
        <script type="text/javascript">CreateMenu();</script>
      </nav>

      <main class="main-content">
        <div class="headline-group">
          <h1>Elektronischer Programmführer (EPG)</h1>
          <h2>Aktuelle TV-Programmdaten und Sendezeiten</h2>
        </div>

        <div id="message" class="status-display-box justify-center font-bold">&nbsp;</div>

        <div id="events" class="epg-container">
          
          <!-- EPG Steuerungs- und Suchleiste -->
          <section class="card epg-controls-card">
            <div class="epg-search-row">
              <form action="javascript:SearchText()" class="epg-search-form">
                <input id="searchtext" class="form-control" type="search" 
                       placeholder="Sender oder Sendung suchen..." onchange="SearchText()">
              </form>
              
              <form action="javascript:void(0)" class="epg-date-form">
                <input id="datetime" type="datetime-local" class="form-control" onchange="ScrollTo()">
              </form>
            </div>

            <div class="epg-navigation-buttons">
              <input type="button" class="btn btn-secondary btn-sm" value="|<" onclick="Scroll(-9999999)" title="Anfang">
              <input type="button" class="btn btn-secondary btn-sm" value="<<<" onclick="Scroll(-500)">
              <input type="button" class="btn btn-secondary btn-sm" value="<<" onclick="Scroll(-50)">
              <input type="button" class="btn btn-secondary btn-sm" value="<" onclick="Scroll(-5)">
              <input type="button" class="btn btn-primary btn-sm" value="Jetzt" onclick="Current()">
              <input type="button" class="btn btn-secondary btn-sm" value=">" onclick="Scroll(+5)">
              <input type="button" class="btn btn-secondary btn-sm" value=">>" onclick="Scroll(+50)">
              <input type="button" class="btn btn-secondary btn-sm" value=">>>" onclick="Scroll(+500)">
              <input type="button" class="btn btn-secondary btn-sm" value=">|" onclick="Scroll(+9999999)" title="Ende">
            </div>
          </section>

          <!-- EPG Event Cards (5 Stück) -->
          <div class="epg-timeline">
            
            <section id="event0" class="card epg-event-card">
              <div class="epg-event-meta">
                <span class="event_channel font-bold text-primary-color">&nbsp;</span>
                <span class="event_date text-muted">&nbsp;</span>
                <span class="event_duration badge">&nbsp;</span>
              </div>
              <h3 class="event_name margin-bottom">&nbsp;</h3>
              <p class="event_text text-muted">&nbsp;</p>
            </section>

            <section id="event1" class="card epg-event-card">
              <div class="epg-event-meta">
                <span class="event_channel font-bold text-primary-color">&nbsp;</span>
                <span class="event_date text-muted">&nbsp;</span>
                <span class="event_duration badge">&nbsp;</span>
              </div>
              <h3 class="event_name margin-bottom">&nbsp;</h3>
              <p class="event_text text-muted">&nbsp;</p>
            </section>

            <section id="event2" class="card epg-event-card">
              <div class="epg-event-meta">
                <span class="event_channel font-bold text-primary-color">&nbsp;</span>
                <span class="event_date text-muted">&nbsp;</span>
                <span class="event_duration badge">&nbsp;</span>
              </div>
              <h3 class="event_name margin-bottom">&nbsp;</h3>
              <p class="event_text text-muted">&nbsp;</p>
            </section>

            <section id="event3" class="card epg-event-card">
              <div class="epg-event-meta">
                <span class="event_channel font-bold text-primary-color">&nbsp;</span>
                <span class="event_date text-muted">&nbsp;</span>
                <span class="event_duration badge">&nbsp;</span>
              </div>
              <h3 class="event_name margin-bottom">&nbsp;</h3>
              <p class="event_text text-muted">&nbsp;</p>
            </section>

            <section id="event4" class="card epg-event-card">
              <div class="epg-event-meta">
                <span class="event_channel font-bold text-primary-color">&nbsp;</span>
                <span class="event_date text-muted">&nbsp;</span>
                <span class="event_duration badge">&nbsp;</span>
              </div>
              <h3 class="event_name margin-bottom">&nbsp;</h3>
              <p class="event_text text-muted">&nbsp;</p>
            </section>

          </div>
        </div>
      </main>
    </div>
  </div>
</body>
</html>
