<!DOCTYPE HTML>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OctopusNet - LNB Settings</title>
  <link rel="stylesheet" type="text/css" href="/style.css">
  <script type="text/javascript" src="/menu.js"></script>
  <!-- Included scripts -->
  <script type="text/javascript" src="/lnbsettings.lua"></script>
  
  <!-- Page scripts -->
  <script type="text/javascript">
  function SaveSettings() {
    var Mode = document.getElementById("ModeButton").checked;
    var form = document.createElement("form");
    form.setAttribute("method", "post");
    form.setAttribute("action", "/lnbsettings.lua?set");
    var field = document.createElement("input");
    field.setAttribute("type", "hidden");
    field.setAttribute("name", "auto");
    field.setAttribute("value", Mode ? "0" : "1");
    form.appendChild(field);
    
    if (Mode) {
      var table = document.getElementById("LNBTable");
      var Rows = table.getElementsByTagName("tr");
      for (var i = 1; i < Rows.length; i++) {
        var Cols = Rows[i].getElementsByTagName("td");
        field = document.createElement("input");
        field.setAttribute("type", "hidden");
        field.setAttribute("name", "LNB");
        var value = i.toString();
        for (var j = 1; j < 6; j++) {
          var curValue = Cols[j].firstChild.nodeValue;
          if (curValue == "-") curValue = "0";
          value = value + "." + curValue;
        }
        field.setAttribute("value", value);
        form.appendChild(field);
      }
    }
    document.body.appendChild(form);
    form.submit();
    return false;
  }

  function CreateRow(LNB, Tuner, Source, LOF1, LOF2, LOFS) {
    var row = document.createElement("tr");
    var col, txt;
    
    col = document.createElement("td");
    txt = document.createTextNode(LNB + 1);
    col.appendChild(txt); row.appendChild(col);
    
    col = document.createElement("td");
    txt = document.createTextNode(Tuner > 0 ? Tuner : "-");
    col.appendChild(txt); row.appendChild(col);
    
    col = document.createElement("td");
    txt = document.createTextNode(Source > 0 ? Source : "-");
    col.appendChild(txt); row.appendChild(col);
    
    col = document.createElement("td");
    txt = document.createTextNode(LOF1 > 0 ? LOF1 : "?");
    col.appendChild(txt); row.appendChild(col);
    
    col = document.createElement("td");
    txt = document.createTextNode(LOF2 > 0 ? LOF2 : "-");
    col.appendChild(txt); row.appendChild(col);
    
    col = document.createElement("td");
    txt = document.createTextNode(LOFS > 0 ? LOFS : "-");
    col.appendChild(txt); row.appendChild(col);
    
    return row;
  }

  function InsertRow(Tuner, Source, LOF1, LOF2, LOFS) {
    var table = document.getElementById("LNBTable");
    var Rows = table.getElementsByTagName("tr");
    var LNB = 0, curRow = null;
    
    for (var i = 1; i < Rows.length; i++) {
      var Cols = Rows[i].getElementsByTagName("td");
      var curTuner = Cols[1].firstChild.nodeValue;
      var curSource = Cols[2].firstChild.nodeValue;
      if (curTuner == "-") curTuner = 0;
      if (curSource == "-") curSource = 0;
      if (curTuner == Tuner && curSource == Source) {
        Cols[3].firstChild.nodeValue = LOF1 > 0 ? LOF1 : "?";
        Cols[4].firstChild.nodeValue = LOF2 > 0 ? LOF2 : "-";
        Cols[5].firstChild.nodeValue = LOFS > 0 ? LOFS : "-";
        return false;
      }
      if ((Tuner == curTuner && curSource > Source) || curTuner > Tuner) {
        curRow = Rows[i];
        break;
      }
      LNB = LNB + 1;
    }
    var newRow = CreateRow(LNB, Tuner, Source, LOF1, LOF2, LOFS);
    if (curRow == null) {
      table.appendChild(newRow);
    } else {
      for (var i = LNB + 1; i < Rows.length; i++) {
        Rows[i].getElementsByTagName("td")[0].firstChild.nodeValue = i + 1;
      }
      table.insertBefore(newRow, curRow);
    }
  }

  function ClearLNB() {
    document.getElementById("SetButton").disabled = false;
    var table = document.getElementById("LNBTable");
    while (true) {
      var Rows = table.getElementsByTagName("tr");
      if (Rows.length <= 1) break;
      table.removeChild(Rows[1]);
    }
  }

  function AddLNB() {
    document.getElementById("SetButton").disabled = false;
    var Tuner = document.getElementById("Tuner").value;
    var Source = document.getElementById("Source").value;
    var LOF1 = document.getElementById("LOF1").value;
    var LOF2 = document.getElementById("LOF2").value;
    var LOFS = document.getElementById("LOFS").value;
    
    Tuner = (Tuner == "") ? 0 : parseInt(Tuner);
    Source = (Source == "") ? 0 : parseInt(Source);
    LOF1 = parseInt(LOF1);
    LOF2 = (LOF2 == "") ? 0 : parseInt(LOF2);
    LOFS = (LOFS == "") ? 0 : parseInt(LOFS);
    
    if (isNaN(Tuner) || isNaN(Source) || isNaN(LOF1) || isNaN(LOF2) || isNaN(LOFS)) return;
    if (Tuner > 0 && Source == 0) return;
    if (Tuner > 8 || Source > 4) return;
    InsertRow(Tuner, Source, LOF1, LOF2, LOFS);
  }

  function ChangeMode() {
    document.getElementById("SetButton").disabled = false;
    if (document.getElementById("ModeButton").checked) {
      document.getElementById("AutoSetting").style.display = "none";
      document.getElementById("ManualSetting").style.display = "block";
    } else {
      document.getElementById("AutoSetting").style.display = "block";
      document.getElementById("ManualSetting").style.display = "none";
    }
  }

  function OnLoad() {
    document.getElementById("SetButton").disabled = true;
    if (LNBList.length > 0) {
      document.getElementById("ModeButton").checked = true;
      document.getElementById("AutoSetting").style.display = "none";
      document.getElementById("ManualSetting").style.display = "block";
      var table = document.getElementById("LNBTable");
      for (var i = 0; i < LNBList.length; i++) {
        var Row = CreateRow(i, LNBList[i].Tuner, LNBList[i].Source, 
                            LNBList[i].LOF1, LNBList[i].LOF2, LNBList[i].LOFS);
        table.appendChild(Row);
      }
    } else {
      document.getElementById("ModeButton").checked = false;
      document.getElementById("AutoSetting").style.display = "block";
      document.getElementById("ManualSetting").style.display = "none";
    }
  }
  </script>
</head>
<body onload="OnLoad()">
  <div class="app-container">
    
    <header class="main-header">
      <a href="http://digitaldevices.de" class="logo-link">
        <img src="/BannerDD.jpg" alt="Digital Devices Logo" class="logo-img" />
      </a>
    </header>

    <div class="content-wrapper">
      <nav class="side-navigation">
        <script type="text/javascript">CreateMenu();</script>
      </nav>

      <main class="main-content">
        <div class="headline-group">
          <h1>LNB Einstellungen</h1>
          <h2>Antennen- und Satelliten-Konfiguration anpassen</h2>
        </div>

        <!-- Globale Modus-Auswahl -->
        <section class="card">
          <h3>Konfigurationsmodus</h3>
          <div class="form-grid">
            <div class="form-group row-align">
              <label for="ModeButton" class="font-bold">Manuelle LNB-Konfiguration aktivieren</label>
              <input id="ModeButton" type="checkbox" class="form-checkbox" onclick="ChangeMode()">
            </div>
          </div>
          <div class="button-container margin-top">
            <input type="button" class="btn btn-secondary" value="Cancel" onclick="location.replace('index.html')">
            <input id="SetButton" type="button" class="btn btn-primary" value="Set" onclick="SaveSettings()">
          </div>
        </section>

        <!-- Automatischer Modus (Sichtbar wenn Checkbox inaktiv) -->
        <div id="AutoSetting" class="dashboard-grid">
          <section class="card full-width">
            <h3>Automatische LNB-Zuweisung</h3>
            <div class="status-display-box">
              <span class="badge">Aktiv</span>
              <span class="status-msg"><strong>Ku-Band:</strong> Universal LNB vorkonfiguriert.</span>
            </div>
          </section>
        </div>

        <!-- Manueller Modus (Sichtbar wenn Checkbox aktiv) -->
        <div id="ManualSetting" class="dashboard-grid">
          
          <!-- Eingabe-Formular -->
          <section class="card">
            <h3>LNB hinzufügen</h3>
            <div class="form-grid">
              <div class="form-group">
                <label>Tuner <span class="text-muted">(Leer für alle)</span></label>
                <input id="Tuner" type="text" class="form-control" maxlength="2">
              </div>
              <div class="form-group">
                <label>Source / Satelliten-Position <span class="text-muted">(Leer für alle)</span></label>
                <input id="Source" type="text" class="form-control" maxlength="1">
              </div>
              <div class="form-group">
                <label>LOF low (MHz)</label>
                <input id="LOF1" type="text" class="form-control" value="9750" maxlength="5">
              </div>
              <div class="form-group">
                <label>LOF high (MHz) <span class="text-muted">(Leer wenn ungenutzt)</span></label>
                <input id="LOF2" type="text" class="form-control" value="10600" maxlength="5">
              </div>
              <div class="form-group">
                <label>LOF switch (MHz) <span class="text-muted">(Leer wenn ungenutzt)</span></label>
                <input id="LOFS" type="text" class="form-control" value="11700" maxlength="5">
              </div>
            </div>
            <div class="button-container margin-top">
              <input id="ClearButton" type="button" class="btn btn-danger" value="Clear All" onclick="ClearLNB()">
              <input id="AddButton" type="button" class="btn btn-primary" value="Add LNB" onclick="AddLNB()">
            </div>
          </section>

          <!-- Aktive LNB Tabelle -->
          <section class="card">
            <h3>Aktuelle LNB-Zuordnungen</h3>
            <table class="data-table display-table-headers">
              <thead>
                <tr>
                  <th>LNB</th>
                  <th>Tuner</th>
                  <th>Source</th>
                  <th>LOF low</th>
                  <th>LOF high</th>
                  <th>Switch</th>
                </tr>
              </thead>
              <tbody id="LNBTable">
                <!-- Dynamische Zeilen werden hier injiziert -->
              </tbody>
            </table>
          </section>

        </div>
      </main>
    </div>
  </div>
</body>
</html>
