<!DOCTYPE HTML>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OctopusNet - System Update</title>
  <link rel="stylesheet" type="text/css" href="/style.css">
  <script type="text/javascript">
  var WaitCounter = 30;
  var UpdateError = false;
  var isReboot = false;

  function FWVersion(fwdate) {
    var date = new Date(1);
    date.setUTCDate(fwdate.substr(4,2));
    date.setUTCFullYear("20"+fwdate.substr(0,2));
    date.setUTCMonth(fwdate.substr(2,2)-1);
    date.setUTCHours(fwdate.substr(6,2));
    date.setUTCMinutes(fwdate.substr(8,2));
    var ds = date.toGMTString();
    return ds.substring(5, ds.length - 7);
  }

  var xmlhttp = new XMLHttpRequest();
  xmlhttp.onreadystatechange = function() {
    if (xmlhttp.readyState == 4 && xmlhttp.status == 200) {
      myFunction(xmlhttp.responseText);
    }
  }

  function Request(url) {
     xmlhttp.open("GET", url, true);
     xmlhttp.send();
  }

  function myFunction(response) {
     if(isReboot) return;
     var UpdateStatus = JSON.parse(response);
     
     if(UpdateStatus.Error) {
       document.getElementById("UpdateButton").disabled = false;    
       document.getElementById("UpdateButton").value = "Continue";    
       document.getElementById("updatestatus").firstChild.nodeValue = 
          UpdateStatus.Status;   
       UpdateError = true;
       document.getElementById("update-card").classList.add("border-danger");
     } else if(UpdateStatus.Status == "Started") {
       window.setTimeout(RequestStatus, 250);  
     } else if(UpdateStatus.Status == "VerifyDone") {
       document.getElementById("UpdateButton").disabled = false;    
       document.getElementById("UpdateButton").value = "Reboot";    
       document.getElementById("updatestatus").firstChild.nodeValue = 
          "Update erfolgreich verifiziert. Bitte Neustart durchführen.";    
     } else if(UpdateStatus.Status == "DownloadDone") {
       document.getElementById("updatestatus").firstChild.nodeValue = 
          "Verifying firmware...";    
       window.setTimeout(RequestStatus, 250);  
     } else if(UpdateStatus.Status == "CheckDone") {
       document.getElementById("updatestatus").firstChild.nodeValue = 
          "Downloading firmware...";    
       window.setTimeout(RequestStatus, 250);  
     } else {
       window.setTimeout(RequestStatus, 250);  
     }
  }

  function RequestStatus() {
     xmlhttp.open("GET", "/update.lua?updatestatus", true);
     xmlhttp.send();
  }

  function DoUpdate() {
    document.getElementById("updatestatus").firstChild.nodeValue = 
       "Checking for updates...";
    Request("/update.lua?update");
  }

  function Reboot() {
    document.getElementById("UpdateButton").disabled = true;    
    if(UpdateError) {
      location.replace('/index.html');
    } else {
      isReboot = true;
      Request("/reboot.lua?sjiwjsiowjs");
      WaitCounter = 70;
      document.getElementById("updatestatus").firstChild.nodeValue = 
         "Rebooting... " + WaitCounter + "s";
      window.setTimeout(Wait, 1000);  
    }
  }

  function Wait() {
    if(WaitCounter == 0) {
      location.replace('/index.html');
    } else {
      document.getElementById("updatestatus").firstChild.nodeValue = 
         "System startet neu... Bitte warten: " + WaitCounter + "s";
      WaitCounter = WaitCounter - 1;
      window.setTimeout(Wait, 1000);  
    }
  }
  </script>
</head>


dy onload="DoUpdate()">
  <div class="app-container">
    
    <header class="main-header">
      <img src="/BannerDD.jpg" alt="Digital Devices Logo" class="logo-img" />
    </header>

    <div class="content-wrapper">
      <!-- Leere Navigation, um Ablenkung während des Flash-Vorgangs zu verhindern -->
      <nav class="side-navigation" style="opacity: 0.4; pointer-events: none;">
        <ul class="menu-list">
          <li class="menucur"><span>Update läuft...</span></li>
        </ul>
      </nav>

      <main class="main-content">
        <div id="update-card" class="card text-center text-center-content">
          
          <div class="update-warning-icon">⚠️</div>
          
          <h1 class="text-danger margin-bottom">BITTE DAS GERÄT NICHT AUSSCHALTEN!</h1>
          
          <p class="update-subtext">
            Ein Firmware-Update wird im Hintergrund ausgeführt. Bitte trenne die 
            Stromversorgung deiner OctopusNet während dieses Prozesses nicht.
          </p>

          <div class="status-display-box justify-center margin-top-heavy">
            <span id="updatestatus" class="status-msg font-bold font-large">
              Initialisiere Update...
            </span>
          </div>

          <div class="center-content margin-top-heavy">
            <form action="">
               <input id="UpdateButton" type="button" class="btn btn-primary" 
                      value="Bitte warten..." disabled="true" onclick="Reboot()" />
            </form>
          </div>

        </div>
      </main>
    </div>

  </div>
</body>
</html>
