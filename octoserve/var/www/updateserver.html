<!DOCTYPE HTML>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OctopusNet - Update Check</title>
  <link rel="stylesheet" type="text/css" href="/style.css">
  <script type="text/javascript" src="/menu.js"></script>
  <!-- Included scripts -->
  <script type="text/javascript" src="/systeminfo.lua"></script>

  <!-- Page scripts -->
  <script type="text/javascript">
  var isChecking = false;
  var UpdateAvailable = false;

  function FWVersion(fwdate) {
    if (fwdate && fwdate.length > 0) {
      var date = new Date(1);
      // REIHENFOLGE KORRIGIERT: Erst Jahr und Monat, dann der Tag
      date.setUTCFullYear("20" + fwdate.substr(0,2));
      date.setUTCMonth(fwdate.substr(2,2) - 1);
      date.setUTCDate(fwdate.substr(4,2));
      date.setUTCHours(fwdate.substr(6,2));
      date.setUTCMinutes(fwdate.substr(8,2));
      var ds = date.toGMTString();
      return (ds.substring(5, ds.length - 7));
    }
    return ("?");
  }

  var xmlhttp = new XMLHttpRequest();
  xmlhttp.onreadystatechange = function() {
    if (xmlhttp.readyState == 4) {
      if (xmlhttp.status == 200) {
        myFunction(xmlhttp.responseText);
      }
      isChecking = false;
    }
  }

  function Request(url) {
     xmlhttp.open("GET", url, true);
     xmlhttp.send();
  }

  function myFunction(response) {
      var UpdateStatus = JSON.parse(response);
      var statusBox = document.getElementById("scan-status-box");
      if (statusBox) statusBox.style.display = "flex";

      // KORREKTUR: .textContent statt .firstChild.nodeValue genutzt, damit UpdateAvailable sicher auf true gesetzt wird
      if (UpdateStatus.Info && UpdateStatus.Info != "") {
        document.getElementById("UpdateButton").value = "Update starten";    
        document.getElementById("UpdateButton").className = "btn btn-primary";    
        document.getElementById("updatemsg").textContent = "Neue Firmware / Systempaket verfügbar!";    
        document.getElementById("updatestatus").textContent = "Version: " + FWVersion(UpdateStatus.Info);    
        UpdateAvailable = true;
      } else {
        document.getElementById("updatestatus").textContent = "Deine Systemsoftware ist auf dem neuesten Stand.";    
      }
      document.getElementById("UpdateButton").disabled = false;    
  }

  function CheckUpdate() {
    if (!isChecking) {
      document.getElementById("UpdateButton").disabled = true;    
      isChecking = true;
      if (UpdateAvailable) {
        location.replace('/doupdate.html');
      } else {
        var statusBox = document.getElementById("scan-status-box");
        if (statusBox) statusBox.style.display = "flex";
        document.getElementById("updatestatus").textContent = "Suche nach Updates...";
        Request("/update.lua?check"); 
      }
    }
  }

  // --- Server-Auswahl-Steuerung ---
  function ToggleServerFields(isCustom) {
      var container = document.getElementById("custom-server-fields");
      if (container) {
          container.style.display = isCustom ? "block" : "none";
      }
      var srvIp = document.getElementById("ServerIP");
      if (srvIp) {
          srvIp.required = isCustom;
      }
  }

  // Strikte Validierung der privaten Subnetze
  function isValidLocalIPv4(ip) {
      var blocks = ip.split('.');
      if (blocks.length !== 4) return false;
      
      var o1 = Number(blocks[0]);
      var o2 = Number(blocks[1]);
      var o3 = Number(blocks[2]);
      var o4 = Number(blocks[3]);

      if (isNaN(o1) || isNaN(o2) || isNaN(o3) || isNaN(o4)) return false;
      if (o1 < 0 || o1 > 255 || o2 < 0 || o2 > 255 || o3 < 0 || o3 > 255 || o4 < 0 || o4 > 255) return false;
      
      for (var i = 0; i < blocks.length; i++) {
          if (blocks[i].length > 1 && blocks[i].startsWith('0')) return false;
      }

      var is10 = (o1 === 10);
      var is172 = (o1 === 172 && o2 >= 16 && o2 <= 31);
      var is192 = (o1 === 192 && o2 === 168);

      return (is10 || is172 || is192);
  }

  function LoadServerConfig() {
      var xhr = new XMLHttpRequest();
      xhr.onreadystatechange = function() {
          if (xhr.readyState == 4 && xhr.status == 200) {
              var config = JSON.parse(xhr.responseText);
              if (config.type === "custom") {
                  document.getElementById("srv-custom").checked = true;
                  document.getElementById("ServerIP").value = config.ip || "";
                  ToggleServerFields(true);
              } else {
                  document.getElementById("srv-official").checked = true;
                  ToggleServerFields(false);
              }
          }
      };
      xhr.open("GET", "/updateserver.lua?getserver=1", true);
      xhr.send();
  }

  function SaveServerConfig(event) {
      event.preventDefault();
      var type = document.querySelector('input[name="srv_type"]:checked').value;
      var ipVal = document.getElementById("ServerIP").value.trim();
      var saveStatus = document.getElementById("save-status");

      saveStatus.style.display = "block";
      saveStatus.style.color = "var(--text-main)";
      saveStatus.textContent = "Speichere Server-Konfiguration...";

      if (type === "custom" && !isValidLocalIPv4(ipVal)) {
          saveStatus.textContent = "❌ Fehler: Adresse muss eine gültige lokale IP-Adresse sein (10.x, 172.16-31.x, 192.168.x)!";
          saveStatus.style.color = "#dc3545";
          document.getElementById("ServerIP").focus();
          return;
      }

      var xhr = new XMLHttpRequest();
      xhr.open("POST", "/updateserver.lua", true);
      xhr.setRequestHeader("Content-Type", "application/x-www-form-urlencoded");
      
      xhr.onreadystatechange = function() {
          if (xhr.readyState == 4) {
              if (xhr.status == 200) {
                  saveStatus.textContent = "✅ Server-Konfiguration erfolgreich angepasst!";
                  saveStatus.style.color = "#28a745";

                  UpdateAvailable = false;
                  isChecking = false;
                  
                  var updateBtn = document.getElementById("UpdateButton");
                  if (updateBtn) {
                      updateBtn.value = "Prüfen";
                      updateBtn.className = "btn btn-secondary";
                      updateBtn.disabled = false;
                  }
                  
                  // KORREKTUR: .textContent angewendet
                  var updateMsg = document.getElementById("updatemsg");
                  if (updateMsg) {
                      updateMsg.textContent = "Firmware / System-Paket überprüfen";
                  }
                  
                  var statusBox = document.getElementById("scan-status-box");
                  if (statusBox) {
                      statusBox.style.display = "none";
                  }
                  
                  var updateStatusText = document.getElementById("updatestatus");
                  if (updateStatusText) {
                      updateStatusText.textContent = "Initialisiere Suche...";
                  }

              } else {
                  saveStatus.textContent = "❌ Fehler beim Speichern (Status: " + xhr.status + ")";
                  saveStatus.style.color = "#dc3545";
              }
          }
      };
      xhr.send("action=saveserver&type=" + type + "&ip=" + encodeURIComponent(ipVal));
  }
  </script>
<body onload="LoadServerConfig()">
  <div class="app-container">
    
    <header class="main-header">
      <a href="http://digitaldevices.de" class="logo-link">
        <img src="/krake_octo.png" alt="Digital Devices Logo" class="logo-img" />
      </a>
    </header>

    <div class="content-wrapper">
      <nav class="side-navigation">
        <script type="text/javascript">CreateMenu();</script>
      </nav>

      <main class="main-content">
        <div class="headline-group">
          <h1>System Update</h1>
          <h2>Firmware-Version prüfen und OctopusNet-System aktualisieren</h2>
        </div>

        <div class="dashboard-grid">
          <section class="card full-width text-center-content">
            
            <!-- Server-Auswahlkomponente -->
            <h3 class="margin-bottom">Updateserver-Quelle konfigurieren</h3>
            
            <form onsubmit="SaveServerConfig(event)" style="max-width: 500px; margin: 0 auto 25px auto;">
              <!-- KORREKTUR: Zusammengefügter Zeilenumbruch bei border-radius -->
              <div style="display: flex; flex-direction: column; gap: 12px; background: var(--bg-color); padding: 15px; border-radius: var(--border-radius); text-align: left; margin-bottom: 15px;">
                <!-- KORREKTUR: Zusammengefügter Zeilenumbruch bei style="transform... -->
                <label style="display: flex; align-items: center; gap: 8px; cursor: pointer; font-weight: 600;">
                  <input type="radio" id="srv-official" name="srv_type" value="official" checked onclick="ToggleServerFields(false)" style="transform: scale(1.1);">
                  Offizieller Digital Devices Server
                </label>
                <!-- KORREKTUR: Zusammengefügter Zeilenumbruch bei style="transform... -->
                <label style="display: flex; align-items: center; gap: 8px; cursor: pointer; font-weight: 600;">
                  <input type="radio" id="srv-custom" name="srv_type" value="custom" onclick="ToggleServerFields(true)" style="transform: scale(1.1);">
                  Eigener Updateserver (Lokal)
                </label>
              </div>

              <div id="custom-server-fields" style="display: none; margin-bottom: 15px;">
                <table class="data-table">
                  <tr>
                    <td><label for="ServerIP"><strong>Server IP-Adresse:</strong></label></td>
                    <td>
                      <!-- KORREKTUR: Zusammengefügter Zeilenumbruch bei placeholder-IP -->
                      <input type="text" id="ServerIP" class="btn btn-secondary text-left" style="width: 100%; cursor: text;" placeholder="z.B. 192.168.1.100" pattern="^(?:[0-9]{1,3}\.){3}[0-9]{1,3}$">
                    </td>
                  </tr>
                </table>
              </div>
              <p id="save-status" class="font-bold" style="display: none; margin-bottom: 15px; font-size: 0.9rem;"></p>
              <div class="button-container" style="justify-content: center;">
                <input type="submit" class="btn btn-primary" value="Quelle保存" style="display:none;" id="hidden-submit">
                <input type="submit" class="btn btn-primary" value="Quelle speichern">
              </div>
            </form>

            <hr class="card-divider" style="margin: 30px 0; border: none; border-bottom: 2px solid var(--accent-color);"/>

            <!-- Originale Online-Prüfung -->
            <div class="update-warning-icon">🔄</div>
            
            <h3 id="updatemsg" class="margin-bottom">Firmware / System-Paket überprüfen</h3>
            
            <p class="update-subtext">
              Klicke auf den Button, um online nach verfügbaren Aktualisierungen 
              für deine OctopusNet-Hardware zu suchen.
            </p>

            <div class="center-content margin-top-heavy">
              <!-- KORREKTUR: onsubmit="return false;" verhindert ungewollte Seiten-Reloads beim Button-Klick -->
              <form action="" class="margin-none" onsubmit="return false;">
                 <input id="UpdateButton" type="button" class="btn btn-secondary" 
                        value="Prüfen" onclick="CheckUpdate()" />
              </form>
            </div>

            <!-- Status-Anzeige (Wird bei Aktivierung eingeblendet) -->
            <div id="scan-status-box" class="status-display-box justify-center margin-top-heavy" style="display: none;">
              <span id="scancount" class="status-count">i</span>
              <span id="updatestatus" class="status-msg font-bold">Initialisiere Suche...</span>
            </div>

          </section>
        </div>
      </main>
    </div>

  </div>
</body>
</html>
