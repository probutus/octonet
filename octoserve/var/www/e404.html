<!DOCTYPE HTML>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OctopusNet - 404 Not Found</title>
  <link rel="stylesheet" type="text/css" href="/style.css">
  <script type="text/javascript" src="/menu.js"></script>
</head>
<body>
  <div class="app-container">
    
    <!-- Identischer Header -->
    <header class="main-header">
      <a href="http://www.digitaldevices.de" class="logo-link">
        <img src="/krake_octo.png" alt="Digital Devices Logo" class="logo-img" />
      </a>
    </header>

    <div class="content-wrapper">
      <!-- Identische Navigation links -->
      <nav class="side-navigation">
        <script type="text/javascript">CreateMenu();</script>
      </nav>

      <!-- Hauptinhalt rechts -->
      <main class="main-content">
        <div class="headline-group">
          <h1>Seite nicht gefunden</h1>
          <h2>HTTP Error 404 - Not Found</h2>
        </div>

        <!-- Zentrierte Fehler-Card -->
        <div class="dashboard-grid">
          <section class="card full-width text-center">
            <div class="update-warning-icon">🔍</div>
            <h2 class="text-danger margin-bottom">
              404: Die angeforderte Ressource wurde nicht gefunden
            </h2>
            <p class="update-subtext" style="margin-bottom: 20px;">
              Die von dir aufgerufene Seite existiert nicht oder wurde verschoben.
              Überprüfe die URL oder kehre zur Übersicht zurück.
            </p>
            <div class="center-content">
              <a href="/index.html" class="btn btn-primary">
                Zurück zur Hauptseite
              </a>
            </div>
          </section>
        </div>
      </main>
    </div>

  </div>
</body>
</html>
