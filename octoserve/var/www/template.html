<!DOCTYPE HTML>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OctopusNet - Template</title>
  <link rel="stylesheet" type="text/css" href="/style.css">
  <script type="text/javascript" src="/menu.js"></script>
  <!-- Hier bei Bedarf zusätzliche Skripte einbinden -->
</head>
<body>

  <div class="app-container">
    
    <!-- Identischer Header auf allen Seiten -->
    <header class="main-header">
      <a href="http://www.digitaldevices.de" class="logo-link">
        <img src="/BannerDD.jpg" alt="Digital Devices Logo" class="logo-img" />
      </a>
    </header>

    <div class="content-wrapper">
      <!-- Identische Navigation links -->
      <nav class="side-navigation">
        <script type="text/javascript">CreateMenu();</script>
      </nav>

      <!-- Hauptinhalt rechts -->
      <main class="main-content">
        <div class="headline-group">
          <h1>Seitenüberschrift</h1>
          <h2>Untertitel oder kurze Beschreibung der Funktion</h2>
        </div>

        <!-- Inhaltsbereich verpackt in das flexible Grid- und Card-System -->
        <div class="dashboard-grid">
          <section class="card full-width">
            <h3>Karten-Titel</h3>
            
            <p>bla bla</p>
            <p>bla bla</p>
            <p>bla bla</p>
            <p>bla bla</p>
            <p>bla bla</p>
            
          </section>
        </div>
      </main>
    </div>

  </div>

</body>
</html>
