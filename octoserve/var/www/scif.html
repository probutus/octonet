<!DOCTYPE HTML>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OctopusNet - Unicable Settings</title>
  <link rel="stylesheet" type="text/css" href="/style.css">
  <script type="text/javascript" src="/menu.js"></script>
  <!-- Included scripts -->
  <script type="text/javascript" src="/scifdb.lua"></script>
  <script type="text/javascript" src="/scifsettings.lua"></script>

  <!-- Page scripts -->
  <script type="text/javascript">
  var xmlhttp = new XMLHttpRequest();
  var url = "/octoserve/tunerstatus.json";

  xmlhttp.onreadystatechange = function() {
    if (xmlhttp.readyState == 4 && xmlhttp.status == 200) {
       myFunction(xmlhttp.responseText);
    }
  }

  function myFunction(response) {
     try {
        var tl = JSON.parse(response);         
        for (i = 0; i < tl.TunerList.length; i++) {
          document.getElementById("trTuner" + i).style.display = "flex";  
        }
     } catch(err) {}
  }

  var SCIFEnabled = false;
  var SelectedManufacturer = 0;
  var SelectedUnit = 0;
  var TunerList = new Array();

  function SetManufacturer(ManuIndex) {
    if (SCIFEnabled) document.getElementById("SetButton").disabled = false;
    SelectedManufacturer = ManuIndex;
    document.Unit.Select.length = 0;
    for (var j = 0; j < ManufacturerList[ManuIndex].UnitList.length; j++) {
      document.Unit.Select.options[j] = 
        new Option(ManufacturerList[ManuIndex].UnitList[j].Name, j, false, true);
    }
    SetUnit(ManufacturerList[ManuIndex].UnitList.length - 1);
  }

  function SetUnit(UnitIndex) {
    if (SCIFEnabled) document.getElementById("SetButton").disabled = false;
    SelectedUnit = UnitIndex;

    for (var i = 0; i < TunerList.length; i++) {
      TunerList[i].Select.length = 1;
      var CurUnit = ManufacturerList[SelectedManufacturer].UnitList[UnitIndex];
      for (var j = 0; j < CurUnit.Frequencies.length; j++) {
        TunerList[i].Select.options[j + 1] = 
          new Option('Slot ' + (j + 1) + ': ' + CurUnit.Frequencies[j] + 
                     ' MHz', j + 1, false, true);
      }
      if (i < CurUnit.Frequencies.length) {
        TunerList[i].Select.options[i + 1].selected = true;
      } else {
        TunerList[i].Select.options[0].selected = true;
      }
    }
  }

  function SetSlot(Tuner, SlotIndex) {
    if (SCIFEnabled) document.getElementById("SetButton").disabled = false;
  }

  function SaveSettings() {
    if (SCIFEnabled) {
      var CurUnit = ManufacturerList[SelectedManufacturer].UnitList[SelectedUnit];
      var Protocol = CurUnit.Protocol == "EN50607" ? '2' : '1';
      var param = 'Manufacturer=' + SelectedManufacturer + '&Unit=' + 
                  SelectedUnit + '&Type=' + Protocol;
      for (var i = 0; i < TunerList.length; i++) {
        param += '&Tuner' + (i + 1) + '=';
        var SelectedFrequency = TunerList[i].Select.selectedIndex;
        if (SelectedFrequency > 0) {
          param += SelectedFrequency + ',' + 
                   CurUnit.Frequencies[SelectedFrequency - 1];
        } else {
          param += '0';
        }
      }
      location.replace('/scifsettings.lua?' + param);
    } else {
      location.replace('/scifsettings.lua?reset');
    }
  }

  function SetEnable() {
    SCIFEnabled = document.getElementById("EnableButton").checked;
    document.getElementById("SetButton").disabled = false;
  }

  function OnLoad() {
    SCIFEnabled = false;
    for (var i = 0; i < 12; i++) {
      TunerList[i] = document.getElementById("formTuner" + i);
    }

    document.Manufacturer.Select.length = 0;
    for (var i = 0; i < ManufacturerList.length; i++) {
      var ManuName = ManufacturerList[i].Name;
      if (ManuName == '') ManuName = "-----------------";
      document.Manufacturer.Select.options[i] = new Option(ManuName, i, false, true);
    }

    for (var i = 0; i < Tuner.length; i++) {
      if (Tuner[i].Slot > 0) SCIFEnabled = true;
    }

    if (SCIFEnabled) {
      document.Manufacturer.Select.selectedIndex = Manufacturer;
      SetManufacturer(Manufacturer);
      document.Unit.Select.selectedIndex = Unit;
      SetUnit(Unit);
      for (var i = 0; i < Tuner.length; i++) {
        if (i < TunerList.length) {
          TunerList[i].Select.selectedIndex = Tuner[i].Slot;
        }
      }
    } else {
      document.Manufacturer.Select.selectedIndex = 
        document.Manufacturer.Select.length - 1;
      SetManufacturer(document.Manufacturer.Select.length - 1);
    }
    document.getElementById("EnableButton").checked = SCIFEnabled;
    document.getElementById("SetButton").disabled = true;
    
    xmlhttp.open("GET", url, true);
    xmlhttp.send();
  }
  </script>
</head>
<body onload="OnLoad()">
  <div class="app-container">
    
    <header class="main-header">
      <a href="http://digitaldevices.de" class="logo-link">
        <img src="/BannerDD.jpg" alt="Digital Devices Logo" class="logo-img" />
      </a>
    </header>

    <div class="content-wrapper">
      <nav class="side-navigation">
        <script type="text/javascript">CreateMenu();</script>
      </nav>

      <main class="main-content">
        <div class="headline-group">
          <h1>Unicable Einstellungen (SCR)</h1>
          <h2>Einkabellösung nach EN 50494 / EN 50607 konfigurieren</h2>
        </div>

        <div class="dashboard-grid">
          
          <!-- Spalte 1: Haupteinstellungen -->
          <section class="card">
            <h3>System Aktivierung</h3>
            <div class="form-grid">
              <div class="form-group row-align">
                <label for="EnableButton" class="font-bold">Unicable-Betrieb aktivieren</label>
                <input id="EnableButton" type="checkbox" class="form-checkbox" onclick="SetEnable()">
              </div>
            </div>

            <hr class="card-divider"/>

            <h3>Hardware Profil</h3>
            <div class="form-grid">
              <div class="form-group">
                <label>Hersteller (Manufacturer)</label>
                <form name="Manufacturer" action="" class="margin-none">
                  <select name="Select" class="form-control" onchange="SetManufacturer(document.Manufacturer.Select.selectedIndex)">
                    <option>----</option>
                  </select>
                </form>
              </div>

              <div class="form-group">
                <label>Modell / Racksystem (Unit)</label>
                <form name="Unit" action="" class="margin-none">
                  <select name="Select" class="form-control" onchange="SetUnit(document.Unit.Select.selectedIndex)">
                    <option>----</option>
                  </select>
                </form>
              </div>
            </div>

            <div class="button-container margin-top-heavy">
              <input type="button" class="btn btn-secondary" value="Cancel" onclick="location.replace('index.html')">
              <input id="SetButton" type="button" class="btn btn-primary" value="Set Settings" onclick="SaveSettings()">
            </div>
          </section>

          <!-- Spalte 2: Tuner Frequenz-Slots -->
          <section class="card">
            <h3>Tuner Slot-Zuweisung</h3>
            <p class="update-subtext margin-bottom">
              Weise den erkannten Tunern die entsprechenden Frequenz-Slots deines Einkabelsystems zu.
            </p>
            
            <div class="form-grid layout-scif-tuners">
              <script type="text/javascript">
                for( var i = 0; i < 12 ; i++ )
                {
                  document.write('<div id="trTuner'+i+'" class="form-group row-align" style="display:none; border-bottom:1px solid var(--accent-color); padding-bottom:8px;">');
                  document.write('<label class="font-bold">Tuner ' + (i+1) + '</label>');
                  document.write('<form name="Tuner'+(i+1)+'" id="formTuner'+i+'" action="" class="margin-none">');
                  document.write('<select name="Select" class="form-control width-auto" onchange="SetSlot(1,document.Tuner' +(i+1)+'.Select.selectedIndex)">');
                  document.write('<option>----</option>');
                  document.write('</select>');
                  document.write('</form>');
                  document.write('</div>');
                }
              </script>
            </div>
          </section>

        </div>
      </main>
    </div>
  </div>
</body>
</html>
