<!DOCTYPE HTML>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OctopusNet - Update Server</title>
  <link rel="stylesheet" type="text/css" href="/style.css">
  <script type="text/javascript" src="/menu.js"></script>
</head>

<body>

  <div class="app-container">
    
    <!-- Identischer Header auf allen Seiten -->
    <header class="main-header">
      <a href="http://www.digitaldevices.de" class="logo-link">
        <img src="/BannerDD.jpg" alt="Digital Devices Logo" class="logo-img" />
      </a>
    </header>

    <div class="content-wrapper">
      <!-- Identische Navigation links -->
      <nav class="side-navigation">
        <script type="text/javascript">CreateMenu();</script>
      </nav>

      <!-- Hauptinhalt rechts -->
      <main class="main-content">
        <div class="headline-group">
          <h1>Update Server Selection</h1>
          <h2>Wähle den gewünschten Update-Kanal für deine Hardware</h2>
        </div>

        <!-- Dashboard-Card für die Einstellungen -->
        <div class="dashboard-grid">
          <section class="card full-width">
            <h3>Server Einstellungen</h3>
            
            <div class="button-container">
              <form action="beta.lua" method="get">
                <input type="hidden" name="set" value="beta">
                <input type="submit" class="btn btn-secondary" value="Select Beta Update Server">
              </form>

              <form action="beta.lua" method="get">
                <input type="hidden" name="set" value="std">
                <input type="submit" class="btn btn-primary" value="Select Standard Update Server">
              </form>
            </div>
          </section>
        </div>
      </main>
    </div>

  </div>

</body>
</html>
