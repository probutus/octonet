<!DOCTYPE HTML>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OctopusNet - System Reboot</title>
  <link rel="stylesheet" type="text/css" href="/style.css">
  <script type="text/javascript" src="/menu.js"></script>
  
  <script type="text/javascript">
  var xmlhttp = new XMLHttpRequest();
  var WaitCounter = 0;

  xmlhttp.onreadystatechange = function() {}

  function Request(url) {
     xmlhttp.open("GET", url, true);
     xmlhttp.send();
  }

  var elementsToDisable = [
    "RebootButton", 
    "RestartOctoButton", 
    "RestartDMSButton"
  ];

  function DisableButtons() {
    for (var i = 0; i < elementsToDisable.length; i++) {
      var btn = document.getElementById(elementsToDisable[i]);
      if (btn) btn.disabled = true;
    }
  }

  function StartCountdown(seconds, message) {
    DisableButtons();
    WaitCounter = seconds;
    var statusBox = document.getElementById("scan-status-box");
    if (statusBox) statusBox.style.display = "flex";
    document.getElementById("scancount").firstChild.nodeValue = WaitCounter;
    document.getElementById("scantext").firstChild.nodeValue = message;
    window.setTimeout(Wait, 1000);
  }

  function Reboot() {
    Request("/reboot.lua?sjiwjsiowjs");
    StartCountdown(20, "Gerät startet neu...");
  }

  function RestartOcto() {
    Request("/reboot.lua?restart_octo");
    StartCountdown(4, "SAT>IP Server wird neu gestartet...");
  }

  function RestartDMS() {
    Request("/reboot.lua?restart_dms");
    StartCountdown(4, "DMS wird neu gestartet...");
  }

  function Wait() {
    document.getElementById("scancount").firstChild.nodeValue = WaitCounter;
    if (WaitCounter == 0) {
      location.replace('/index.html');
    } else {
      WaitCounter = WaitCounter - 1;
      window.setTimeout(Wait, 1000);
    }
  }
  </script>
</head>
<body>
  <div class="app-container">
    
    <header class="main-header">
      <a href="http://digitaldevices.de" class="logo-link">
        <img src="/krake_octo.png" alt="Digital Devices Logo" class="logo-img" />
      </a>
    </header>

    <div class="content-wrapper">
      <nav class="side-navigation">
        <script type="text/javascript">CreateMenu();</script>
      </nav>

      <main class="main-content">
        <div class="headline-group">
          <h1>Systemsteuerung & Neustart</h1>
          <h2>Dienste steuern oder die OctopusNet-Hardware neu starten</h2>
        </div>

        <div class="dashboard-grid">
          <section class="card full-width">
            <h3>Verfügbare Aktionen</h3>
            
            <p class="update-subtext margin-bottom">
              Wähle die gewünschte Aktion aus. Während der Ausführung wird ein 
              Countdown angezeigt, danach wirst du automatisch zur Startseite 
              weitergeleitet.
            </p>

            <div class="button-container justify-center">
              <form action="" class="inline-form">
                 <input id="RestartOctoButton" type="button" class="btn btn-secondary" 
                        value="Restart SAT>IP Server" onclick="RestartOcto()" />
              </form>
              
              <form action="" class="inline-form">
                 <input id="RestartDMSButton" type="button" class="btn btn-secondary" 
                        value="Restart DMS Service" onclick="RestartDMS()" />
              </form>

              <form action="" class="inline-form">
                 <input id="RebootButton" type="button" class="btn btn-danger" 
                        value="Hardware Reboot" onclick="Reboot()" />
              </form>
            </div>

            <!-- Countdown Status-Anzeige (Standardmäßig unsichtbar) -->
            <div id="scan-status-box" class="status-display-box justify-center margin-top-heavy" style="display: none;">
              <span id="scancount" class="status-count">--</span>
              <span id="scantext" class="status-msg font-bold">Bitte warten...</span>
            </div>

          </section>
        </div>
      </main>
    </div>

  </div>
</body>
</html>
